<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Game - Interactive Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .input-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .input-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .algorithm-section {
            margin-bottom: 20px;
        }

        .algorithm-section label {
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
            color: #333;
        }

        .algorithm-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .algo-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .algo-btn:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .algo-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-section {
            margin-top: 30px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .path-visualization {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .path-title {
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
        }

        .path-steps {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .path-step {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-weight: 500;
            color: #667eea;
            transition: all 0.3s;
        }

        .path-step:hover {
            background: #667eea;
            color: white;
            cursor: pointer;
        }

        .path-arrow {
            color: #999;
            font-size: 20px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .metric-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .metric-value {
            font-size: 2em;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .metric-label {
            color: #666;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            border: 2px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .success-message {
            background: #efe;
            border: 2px solid #cfc;
            color: #3c3;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .stats-section {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .stats-title {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        @media (max-width: 768px) {
            .input-section {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 2em;
            }

            .path-steps {
                flex-direction: column;
                align-items: stretch;
            }

            .path-arrow {
                transform: rotate(90deg);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 Wikipedia Game</h1>
            <p>Navigate from one Wikipedia article to another using only links!</p>
        </div>

        <div class="main-card">
            <div class="input-section">
                <div class="input-group">
                    <label for="start">Start Article</label>
                    <input type="text" id="start" placeholder="e.g., Potato" value="Potato">
                </div>
                <div class="input-group">
                    <label for="end">Target Article</label>
                    <input type="text" id="end" placeholder="e.g., Pizza" value="Pizza">
                </div>
            </div>

            <div class="algorithm-section">
                <label>Algorithm</label>
                <div class="algorithm-buttons">
                    <button class="algo-btn active" data-algo="semantic">
                        🚀 Semantic (Fast)
                    </button>
                    <button class="algo-btn" data-algo="bidirectional">
                        🎯 Bidirectional (Optimal)
                    </button>
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="findPathBtn">
                    🔍 Find Path
                </button>
                <button class="btn btn-secondary" id="randomBtn">
                    🎲 Random Challenge
                </button>
                <button class="btn btn-secondary" id="stepBtn">
                    👣 Next Step
                </button>
            </div>

            <div id="loading" class="loading" style="display: none;">
                <div class="loading-spinner"></div>
                <p>Searching for path...</p>
            </div>

            <div id="result" class="result-section">
                <div class="path-visualization">
                    <div class="path-title">📍 Path Found</div>
                    <div id="pathSteps" class="path-steps"></div>
                </div>

                <div class="metrics-grid" id="metrics"></div>
            </div>

            <div id="error" style="display: none;"></div>
        </div>

        <div class="stats-section">
            <div class="stats-title">📊 System Statistics</div>
            <div class="metrics-grid" id="systemStats">
                <div class="metric-card">
                    <div class="metric-value" id="kgNodes">-</div>
                    <div class="metric-label">KG Nodes</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="kgEdges">-</div>
                    <div class="metric-label">KG Edges</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value" id="cacheHits">-</div>
                    <div class="metric-label">Cache Hit Rate</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedAlgorithm = 'semantic';
        let isProcessing = false;

        // Get button references
        const findPathBtn = document.getElementById('findPathBtn');
        const randomBtn = document.getElementById('randomBtn');
        const stepBtn = document.getElementById('stepBtn');

        // Disable/enable all buttons
        function setButtonsEnabled(enabled) {
            findPathBtn.disabled = !enabled;
            randomBtn.disabled = !enabled;
            stepBtn.disabled = !enabled;
            document.querySelectorAll('.algo-btn').forEach(btn => {
                btn.disabled = !enabled;
                btn.style.opacity = enabled ? '1' : '0.5';
                btn.style.cursor = enabled ? 'pointer' : 'not-allowed';
            });
        }

        // Algorithm selection
        document.querySelectorAll('.algo-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (isProcessing) return;
                document.querySelectorAll('.algo-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedAlgorithm = btn.dataset.algo;
            });
        });

        // Find path
        findPathBtn.addEventListener('click', async () => {
            if (isProcessing) return;
            
            const start = document.getElementById('start').value.trim();
            const end = document.getElementById('end').value.trim();

            if (!start || !end) {
                showError('Please enter both start and end articles');
                return;
            }

            isProcessing = true;
            setButtonsEnabled(false);
            showLoading(true);
            hideError();
            hideResult();

            try {
                const response = await fetch('/api/navigate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ start, end, algorithm: selectedAlgorithm })
                });

                const data = await response.json();

                if (data.success) {
                    showResult(data);
                    updateStats();
                } else {
                    showError(data.error || 'Failed to find path');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                showLoading(false);
                isProcessing = false;
                setButtonsEnabled(true);
            }
        });

        // Random challenge - with actual randomization
        randomBtn.addEventListener('click', async () => {
            if (isProcessing) return;
            
            isProcessing = true;
            setButtonsEnabled(false);
            
            try {
                const response = await fetch('/api/random');
                const data = await response.json();
                document.getElementById('start').value = data.start.replace(/_/g, ' ');
                document.getElementById('end').value = data.end.replace(/_/g, ' ');
                hideError();
                hideResult();
                
                // Show difficulty and source
                const difficultyEmoji = {
                    'easy': '🟢',
                    'medium': '🟡',
                    'hard': '🔴'
                };
                const emoji = difficultyEmoji[data.difficulty] || '⚪';
                const source = data.source === 'benchmark' ? '📊 Benchmark' : '✨ Curated';
                showError(`${emoji} ${source} challenge (${data.difficulty})`, 'success');
                
                // Auto-hide success message after 3 seconds
                setTimeout(() => {
                    hideError();
                }, 3000);
            } catch (error) {
                showError('Failed to get random challenge');
            } finally {
                isProcessing = false;
                setButtonsEnabled(true);
            }
        });

        // Next step
        stepBtn.addEventListener('click', async () => {
            if (isProcessing) return;
            
            const current = document.getElementById('start').value.trim();
            const target = document.getElementById('end').value.trim();

            if (!current || !target) {
                showError('Please enter both current and target articles');
                return;
            }

            isProcessing = true;
            setButtonsEnabled(false);
            showLoading(true);
            hideError();

            try {
                const response = await fetch('/api/step', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ current, target })
                });

                const data = await response.json();

                if (data.success) {
                    document.getElementById('start').value = data.next.replace(/_/g, ' ');
                    showError(`Next: ${data.next.replace(/_/g, ' ')} (${data.reasoning})`, 'success');
                } else {
                    showError(data.error || 'Failed to get next step');
                }
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                showLoading(false);
                isProcessing = false;
                setButtonsEnabled(true);
            }
        });

        function showResult(data) {
            const resultDiv = document.getElementById('result');
            const pathSteps = document.getElementById('pathSteps');
            const metricsDiv = document.getElementById('metrics');

            // Show path
            pathSteps.innerHTML = data.path.map((step, i) => {
                const arrow = i < data.path.length - 1 ? '<span class="path-arrow">→</span>' : '';
                return `<div class="path-step" onclick="window.open('https://en.wikipedia.org/wiki/${step}', '_blank')">${step.replace(/_/g, ' ')}</div>${arrow}`;
            }).join('');

            // Show metrics
            metricsDiv.innerHTML = `
                <div class="metric-card">
                    <div class="metric-value">${data.length}</div>
                    <div class="metric-label">Articles</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value">${data.metrics.steps}</div>
                    <div class="metric-label">Clicks</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value">${data.time}s</div>
                    <div class="metric-label">Time</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value">${data.algorithm_name}</div>
                    <div class="metric-label">Algorithm</div>
                </div>
            `;

            resultDiv.classList.add('show');
        }

        function showLoading(show) {
            const loadingDiv = document.getElementById('loading');
            loadingDiv.style.display = show ? 'block' : 'none';
            if (show) {
                hideResult();
            }
        }

        function hideResult() {
            document.getElementById('result').classList.remove('show');
        }

        function showError(message, type = 'error') {
            const errorDiv = document.getElementById('error');
            errorDiv.className = type === 'success' ? 'success-message' : 'error-message';
            errorDiv.innerHTML = message; // Use innerHTML to support emojis
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('error').style.display = 'none';
        }

        async function updateStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                document.getElementById('kgNodes').textContent = data.kg.nodes.toLocaleString();
                document.getElementById('kgEdges').textContent = data.kg.edges.toLocaleString();
                document.getElementById('cacheHits').textContent = 
                    data.scraper.hit_rate.toFixed(1) + '%';
            } catch (error) {
                console.error('Failed to update stats:', error);
            }
        }

        // Initial stats load
        updateStats();
        setInterval(updateStats, 5000); // Update every 5 seconds
    </script>
</body>
</html>
